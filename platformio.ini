; JS-CONTROLER - tay cam dieu khien ESP32 (joystick, TFT/OLED, RF TX, audio)
[platformio]
default_envs = esp32_controller

[env:esp32_controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    nrf24/RF24@^1.4.8
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit GFX Library@^1.12.1
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=27
    -D TFT_DC=26
    -D TFT_RST=14
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
build_src_filter =
    +<*>
    -<Main_audio_test.cpp>
    -<main_esp32_n16r8_test.cpp>
board_build.embed_files =
    src/voice_data/armed.pcm
    src/voice_data/disarmed.pcm
    src/voice_data/battery_low.pcm
    src/voice_data/rth_activated.pcm
    src/voice_data/angle_mode.pcm
    src/voice_data/beeper_activated.pcm
    src/voice_data/throttle_warning.pcm
    src/voice_data/flight_controller_ready.pcm
    src/voice_data/telemetry_recovered.pcm
    src/voice_data/telemetry_lost.pcm

; Test board ESP32-S3 (WeAct N16R8)
[env:esp32-s3-weact]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<main_esp32_n16r8_test.cpp>
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

; Test rieng module audio (I2S PCM5100A), khong dung chung logic RC
[env:esp32_audio_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter =
    +<Main_audio_test.cpp>
    +<Audio/>
    +<VoiceData.cpp>
board_build.embed_files =
    src/voice_data/armed.pcm
    src/voice_data/disarmed.pcm
    src/voice_data/battery_low.pcm
    src/voice_data/rth_activated.pcm
    src/voice_data/angle_mode.pcm
    src/voice_data/beeper_activated.pcm
    src/voice_data/throttle_warning.pcm
    src/voice_data/flight_controller_ready.pcm
    src/voice_data/telemetry_recovered.pcm
    src/voice_data/telemetry_lost.pcm
